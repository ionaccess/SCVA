apply plugin: 'com.android.application'

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.SCVA"
        minSdkVersion 23
        targetSdkVersion 27
        externalNativeBuild {
            ndkBuild {
                // abiFilters 'armeabi-v7a', 'x86'
                cFlags "-DHAVE_STRCASESTR"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }


    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    namespace 'com.SCVA'
    lint {
        disable 'MissingTranslation'
    }

}

dependencies {
    implementation files('libs/acra-4.5.0.jar')
    implementation files('libs/pj2_20190611.jar') //jar file for serpent (java parallel lib)
//    implementation project(':aFileDialogoriginal')
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation files('libs/bcprov-ext-jdk15to18-170.jar')
    implementation 'com.dlazaro66.qrcodereaderview:qrcodereaderview:2.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
}
